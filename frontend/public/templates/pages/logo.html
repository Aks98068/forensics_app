
{{ define "logo" }}

                    d="M12 4.5C8.41 4.5 5.5 7.41 5.5 11"

                    stroke-width="1.7"
                    stroke-linecap="round"

                    stroke-width="1.7"
                    stroke-linecap="round"

                <path
                    d="M18.5 11C18.5 7.41 15.59 4.5 12 4.5"
                    stroke="#0F766E"
                    stroke-width="1.7"
                    stroke-linecap="round"
                />

                <path
                    d="M16 11C16 8.79 14.21 7 12 7"
                    stroke="#0F766E"
                    stroke-width="1.7"
                    stroke-linecap="round"
                />

                    stroke-width="1.7"
                    stroke-linecap="round"
                />

                <path
                    d="M18.5 11C18.5 15.42 16.11 18.5 13.5 20"
                    stroke="#0F766E"
                    stroke-width="1.7"
                    stroke-linecap="round"
                />

        </div>


        <!-- =========================================================
             BRAND NAME
             ========================================================= -->

        <div class="hidden sm:block">
